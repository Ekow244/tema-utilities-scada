M215 544H650" class="wire"/><path d="M195 535V553M215 535V553" class="wire"/><text x="110" y="528" class="small">S3 drain request, NO</text><circle cx="515" cy="544" r="4" class="node"/><text x="470" y="532" class="small">X1:07</text><text x="300" y="561" class="small">wire 107</text><text x="670" y="548" class="label">I0.6 · DRAIN_PB</text><path d="M650 591H610V628H65" class="wire"/><text x="75" y="647" class="small">M / 0 V return · DI COM and field reference</text><text x="40" y="685" class="label">OUTPUTS: sourcing (PNP) DO group, V+ supplied from a fused +24 V branch; M tied to 0 V</text><rect x="40" y="710" width="1120" height="190" rx="5" fill="#f0f5f1" stroke="#aac1b3"/><text x="62" y="740" class="label">Q0.0 → X2:01 · wire 201</text><path d="M62 761H127V780H157M205 780H262V850H62" class="wire"/><rect x="157" y="767" width="48" height="27" class="node"/><text x="181" y="785" text-anchor="middle" class="small">K1 relay</text><text x="129" y="805" class="small">A1 +</text><text x="208" y="805" class="small">A2 / 0 V</text><path d="M142 780V824H157M205 824H227V780" class="wire"/><rect x="157" y="815" width="48" height="18" class="node"/><text x="181" y="828" text-anchor="middle" class="small">D1</text><text x="62" y="870" class="small">D1 flyback suppression across relay coil</text><text x="62" y="888" class="small">Cathode to A1; anode to A2 (0 V)</text><text x="427" y="740" class="label">Q0.1 → X2:02 · wire 202</text><path d="M427 761H492V780H522M570 780H627V850H427" class="wire"/><rect x="522" y="767" width="48" height="27" class="node"/><text x="546" y="785" text-anchor="middle" class="small">K2 relay</text><text x="494" y="805" class="small">A1 +</text><text x="573" y="805" class="small">A2 / 0 V</text><path d="M507 780V824H522M570 824H592V780" class="wire"/><rect x="522" y="815" width="48" height="18" class="node"/><text x="546" y="828" text-anchor="middle" class="small">D2</text><text x="427" y="870" class="small">D2 flyback suppression across relay coil</text><text x="427" y="888" class="small">Cathode to A1; anode to A2 (0 V)</text><text x="792" y="740" class="label">Q0.2 → X2:03 · wire 203</text><path d="M792 761H857V780H887M935 780H992V850H792" class="wire"/><rect x="887" y="767" width="48" height="27" class="node"/><text x="911" y="785" text-anchor="middle" class="small">H1 lamp</text><text x="859" y="805" class="small">A1 +</text><text x="938" y="805" class="small">A2 / 0 V</text><text x="792" y="870" class="small">24 V lamp return to M / 0 V</text><text x="40" y="934" class="label">FIELD LOAD CONTROL · conceptual relay contacts</text><path d="M60 966H190M210 966H350" class="wire"/><path d="M190 957V975M210 957V975" class="wire"/><rect x="350" y="953" width="200" height="27" class="node"/><text x="85" y="952" class="small">Fused +24 V</text><text x="177" y="991" class="small">K1 NO</text><text x="365" y="972" class="label">YV1 inlet valve → 0 V</text><path d="M650 966H780M800 966H920" class="wire"/><path d="M780 957V975M800 957V975" class="wire"/><rect x="920" y="953" width="225" height="27" class="node"/><text x="664" y="952" class="small">Fused +24 V</text><text x="766" y="991" class="small">K2 NO</text><text x="930" y="972" class="label">Starter control request → 0 V</text><text x="40" y="1034" class="sub">Relay and valve suppression, fusing, terminal ratings and load currents require device-specific engineering for a physical build.</text><text x="40" y="1058" class="sub">This drawing describes the virtual station only. Ordinary PLC logic and S0 do not implement an emergency-stop safety function.</text><text x="40" y="1082" class="small">Healthy wire shown; the diagnostic fault opens conductor 104 between TP-A and TP-B.</text><text x="40" y="1100" class="small">Reference: AutomationDirect CLICK installation/wiring guide · cdn.automationdirect.com/static/manuals/c0userm/ch3.pdf</text></svg>