name: scada-mvp
services:
  simulator:
    build: .
    environment:
      SIM_SPEED: ${SIM_SPEED:-20}
      DATABASE_URL: postgresql://scada:local-demo-only@postgres:5432/scada
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: scada
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: scada
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scada -d scada"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  node-red:
    image: nodered/node-red:4.0.9
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - ./deploy/node-red/flows.json:/data/flows.json:ro
    depends_on:
      - simulator
      - mqtt
    restart: unless-stopped
  historian:
    build: .
    command: ["python", "-m", "scada.historian"]
    environment:
      DATABASE_URL: postgresql://scada:local-demo-only@postgres:5432/scada
      MQTT_HOST: mqtt
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres-data:
  mqtt-data:
